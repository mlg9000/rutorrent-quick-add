name: Build browser extensions

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # needed only for publishing a GitHub Release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Firefox and Chrome packages
        run: python3 scripts/build.py

      - name: Check release tag matches manifest versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          tag = os.environ['GITHUB_REF_NAME']
          expected = tag.removeprefix('v')
          manifests = sorted(Path('browsers').glob('*/manifest.json'))
          if not manifests:
              raise SystemExit('No browser manifests found')
          for path in manifests:
              version = json.loads(path.read_text())['version']
              if version != expected:
                  raise SystemExit(f'{path}: version {version} does not match tag {tag}')
          print(f'All manifests match {tag}')
          PY

      - name: Verify both ZIP packages exist
        shell: bash
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          packages = sorted(Path('dist').glob('*.zip'))
          assert len(packages) >= 2, f'Expected Firefox and Chrome ZIPs, found {packages}'
          for package in packages:
              with zipfile.ZipFile(package) as z:
                  assert z.testzip() is None, f'Corrupt ZIP: {package}'
                  manifest = json.loads(z.read('manifest.json'))
                  print(package, 'manifest_version:', manifest['manifest_version'])
          assert any('firefox' in p.name for p in packages)
          assert any('chrome' in p.name for p in packages)
          PY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: browser-extensions
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip \
              --title "ruTorrent Quick Add $TAG" \
              --generate-notes \
              --verify-tag
          fi
