name: Build browser extensions
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to publish a GitHub Release on tag pushes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          find src browsers -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build both browsers
        run: python3 scripts/build.py
      - name: Check ZIP integrity and manifest versions
        env:
          GIT_REF_TYPE: ${{ github.ref_type }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTEST'
          import json
          import os
          import zipfile
          from pathlib import Path

          packages = {}
          for browser in ('firefox', 'chrome'):
              manifest_path = Path('browsers') / browser / 'manifest.json'
              expected = json.loads(manifest_path.read_text())['version']
              path = Path('dist') / f'rutorrent-quick-add-{browser}-{expected}-unsigned.zip'
              assert path.is_file(), f'Missing {path}'
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None, f'Corrupt ZIP: {path}'
                  names = set(archive.namelist())
                  assert 'manifest.json' in names, f'Missing manifest.json in {path}'
                  manifest = json.loads(archive.read('manifest.json'))
                  assert manifest['version'] == expected, f'{path}: version mismatch'
                  assert manifest['manifest_version'] == (2 if browser == 'firefox' else 3), f'{path}: wrong manifest type'
              packages[browser] = expected
              print(f'Validated {path} (manifest v{manifest["manifest_version"]})')

          assert len(list(Path('dist').glob('*.zip'))) == 2, 'Expected exactly two packages'
          assert len(set(packages.values())) == 1, f'Browser versions differ: {packages}'
          if os.environ.get('GIT_REF_TYPE') == 'tag':
              tag = os.environ['GIT_REF_NAME']
              assert tag == f'v{packages["firefox"]}', f'Tag {tag} does not match version {packages["firefox"]}'
          PYTEST
      - name: Upload unsigned packages
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-browser-extensions
          path: dist/*.zip
          if-no-files-found: error
      - name: Set up Node.js for Mozilla submission
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Submit Firefox update to Mozilla (listed)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$WEB_EXT_API_KEY" || -z "$WEB_EXT_API_SECRET" ]]; then
            echo 'Missing AMO_JWT_ISSUER or AMO_JWT_SECRET repository secret' >&2
            exit 1
          fi
          npm install --global web-ext@8
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/rqa-firefox"
          python3 - "$VERSION" "$RUNNER_TEMP/rqa-firefox" <<'PYEXTRACT'
          import sys, zipfile
          from pathlib import Path
          version, destination = sys.argv[1:]
          path = Path('dist') / f'rutorrent-quick-add-firefox-{version}-unsigned.zip'
          with zipfile.ZipFile(path) as archive:
              archive.extractall(destination)
          PYEXTRACT
          web-ext sign \
            --source-dir "$RUNNER_TEMP/rqa-firefox" \
            --channel listed \
            --approval-timeout 0
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.zip --title "ruTorrent Quick Add $TAG" --generate-notes
